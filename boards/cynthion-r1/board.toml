# Pluribus board config — Great Scott Gadgets Cynthion r1.x (ECP5)
#
# Cynthion is an open-source USB multitool.  The r1.0–r1.4 production
# hardware all uses the same FPGA: LFE5U-12F in a 256-ball BG package.
#
# Source: cynthion/python/src/gateware/platform/cynthion_r1_0.py
#         https://github.com/greatscottgadgets/cynthion
#
# The r1.4 hardware is what #98's fabric test actually ran on
# (CynthionPlatformRev1D4): LFE5U-12F, BG256, speed grade 8, 60 MHz clock on A8.
#
# Usage:
#   python3.15t load.py --board boards/cynthion-r1 \
#       --label <label> --config <bitstream.config>

[board]
name    = "Great Scott Gadgets Cynthion r1.x"
device  = "LFE5U-12F"
package = "BG256"
lifter  = "ecp5"

# pins.tsv is PARTIAL by design — the pins a fabric self-test needs (#101),
# extracted from the BSD-3-Clause Amaranth platform file.  Cynthion is open
# hardware, so per boards/README.md the pinout belongs in-repo.
[files]
pins_tsv = "pins.tsv"
